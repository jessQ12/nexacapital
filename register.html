<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | NexaCapital</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="auth-page"><header class="header"><div class="container nav"><a class="logo" href="index.html"><span>N</span>NexaCapital</a><a href="index.html" class="back-link">← Home</a></div></header>
<main class="auth-wrap"><form class="form-card auth-card" id="registerForm"><div class="eyebrow">GET STARTED</div><h1>Create demo account</h1><p class="muted">No real funds are requested or processed.</p><div class="two-col"><label>First name<input required name="firstName"></label><label>Last name<input required name="lastName"></label></div><label>Email<input required type="email" name="email" placeholder="you@example.com"></label><label>Country<select required name="country"><option value="">Select country</option><option>United Kingdom</option><option>United States</option><option>Canada</option><option>Australia</option><option>United Arab Emirates</option><option>Other</option></select></label><label>Date of birth<input required type="date" name="dob"></label><label>Password<input required type="password" minlength="8" name="password" placeholder="At least 8 characters"></label><label class="check"><input required type="checkbox"> I understand this is a demo platform.</label><button class="btn btn-primary full" type="submit">Create account</button><p id="registerMessage" class="form-message"></p><div class="form-links"><a href="login.html">Already have an account?</a></div></form></main><script src="assets/js/app.js"></script></body></html>
